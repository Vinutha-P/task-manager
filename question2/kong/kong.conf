# DB-less Kong. Paths are rewritten by scripts/run_question2.sh before start
# because Kong resolves declarative_config and prefix relative to its own prefix.
database = off
declarative_config = kong.yml
proxy_listen = 127.0.0.1:8000
admin_listen = 127.0.0.1:8001
prefix = prefix
nginx_daemon = off
nginx_worker_processes = 1
untrusted_lua = on
log_level = notice
